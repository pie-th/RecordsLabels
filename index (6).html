*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#101011;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:absolute;left:0;top:0;width:430px;height:932px;transform-origin:0 0;overflow:hidden;touch-action:none}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.dark{background:#101011}.black{background:#000}.white{background:#fff}
.a{position:absolute;display:block;pointer-events:none}
button{position:absolute;display:block;background:none;border:0;color:inherit;font:inherit;outline:none;cursor:pointer;touch-action:none}
button:focus-visible{outline:2px solid #888;outline-offset:2px}
#lstack,#sstack{position:absolute;inset:0;z-index:0}
.card{position:absolute;left:0;top:0;width:262px;height:262px;padding:0;overflow:hidden;transform-origin:0 0;will-change:transform}
.card img{display:block;width:100%;height:100%;pointer-events:none}
.ell{position:absolute;width:53.2px;height:53.2px;left:-4.1px;top:-1.1px;pointer-events:none}
.round{width:43px;height:43px;z-index:35}
.round svg.ic{position:absolute;pointer-events:none}
.ham{left:338px;top:20px;width:44px;height:44px;z-index:30}
.ham svg{position:absolute;left:10px;top:10px;width:24px;height:24px;pointer-events:none}
.bb{top:calc(var(--H) - 84px)}
.bb2{top:calc(var(--H) - 135px)}
.txt{position:absolute;font-family:RLText,"Arial Narrow",sans-serif;font-size:16px;line-height:19px;white-space:nowrap;pointer-events:none;color:#000}
#logoBtn{left:21px;top:14px;width:92px;height:56px;z-index:30;display:none}

/* player */
#player{touch-action:none}
#slB,#slF,#pcover,#anim{position:absolute;left:var(--cl);top:var(--ct);width:var(--cs);height:var(--cs)}
#slB{background:#c2c2c2;border-radius:6px;isolation:isolate}
#slB:after{content:'';position:absolute;inset:0;border-radius:6px;background:#eaeaea;mix-blend-mode:soft-light}
#pcover{border-radius:6px;overflow:hidden;mix-blend-mode:multiply}
#pcover img,#pblank{display:block;width:100%;height:100%}
#slF{border-radius:6px;background:rgba(236,236,236,.8);transition:background .55s ease .1s;
 -webkit-mask:radial-gradient(circle 40px at 50% 0,transparent 39px,#000 40px);mask:radial-gradient(circle 40px at 50% 0,transparent 39px,#000 40px)}
#slF.seated{background:rgba(236,236,236,.02)}
#anim{border-radius:4px;background:#b2b2b2;display:none}
.hideDrop{transition:opacity .35s ease}
#player.dropping .hideDrop{opacity:0}
#trk{left:var(--bl);top:calc(var(--bt) - 23px)}
#time{right:calc(430px - var(--bl) - var(--bw) + 1px);top:calc(var(--bt) - 24px)}
#track,#fill{position:absolute;left:var(--bl);top:var(--bt);height:5px}
#track{width:var(--bw);background:#d9d9d9}
#fill{width:0;background:#1b1b1b}
#scrub{position:absolute;left:calc(var(--bl) - 12px);width:calc(var(--bw) + 24px);top:calc(var(--bt) - 14px);height:33px;z-index:24;touch-action:none;cursor:pointer}
#t-track{top:calc(var(--ct) - 38px);left:0;width:430px;text-align:center}
#i-track{left:191.06px;top:calc(var(--ct) - 34.24px)}
#i-special{left:184.42px;top:calc(var(--ct) - 34.24px)}
#i-drift{left:calc(var(--bl) + .98px);top:calc(var(--bt) - 20.42px)}
#i-sil{left:calc(var(--bl) + .45px);top:calc(var(--bt) - 20.35px)}
#wheel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--bt) + 8px);touch-action:none;cursor:grab;z-index:20}
.word{position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:21;transition:filter .12s}
.word img{display:block}
.word.sel img{filter:brightness(0) invert(.827)}
#ring{position:absolute;left:0;top:0;width:43px;height:43px;margin:-21.5px 0 0 -21.5px;pointer-events:none;z-index:22;will-change:transform}
#player.isDark{background:#000}
#player.isDark .word:not(.sel) img{filter:invert(1)}
#player.isDark #time,#player.isDark #t-track,#player.isDark #trk{color:#fff}
#player.isDark #track{background:#656565}
#player.isDark #fill{background:#ededed}
#player.isDark #anim{display:block}
#player.isDark #pcover,#player.isDark #slB,#player.isDark #slF,#player.isDark #lgN{display:none}
#lgW,#sbtn{display:none}
#player.isDark #lgW,#player.isDark #sbtn{display:block}
#player.isDark #ham svg path{stroke:#fff}

/* menu */
#menu{position:absolute;inset:0;display:none;background:rgba(30,30,30,.89);z-index:40}
#menu.on{display:block}
#menu .ham svg{transform:rotate(90deg)}
#menu .ham svg path{stroke:#fff}
#mWrap{position:absolute;left:0;top:var(--my);width:430px;height:932px;pointer-events:none}
#mWrap button{pointer-events:auto}
.mitem{left:0;width:430px;height:138px}
.mitem .band{position:absolute;left:0;top:0;width:430px;height:138px;background:#d9d9d9;mix-blend-mode:overlay;opacity:0;transition:opacity .12s}
.mitem.pressed .band{opacity:1}
#mSil .band{left:1px}
@media(hover:hover){.mitem:hover .band{opacity:1}#share:hover{background:rgba(0,0,0,.82)}#share:hover img{filter:brightness(0) invert(.67)}}

/* about */
#aScroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
#aScroll button{touch-action:pan-y}
#aBar{position:absolute;left:0;top:0;width:430px;height:76px;background:#fff;z-index:5}
#aLow{position:absolute;left:0;top:var(--ay);width:430px;height:932px;pointer-events:none}
#aLow button{pointer-events:auto}
#share{position:absolute;display:block;pointer-events:auto;left:71px;top:803px;width:288px;height:45px;border-radius:3px;background:rgba(0,0,0,.02);box-shadow:3px 5px 11.1px -6px rgba(0,0,0,.17);transition:background .12s}
#share.pressed{background:rgba(0,0,0,.82)}
#share.pressed img{filter:brightness(0) invert(.67)}

/* focus */
#scrim{position:absolute;inset:0;background:rgba(30,30,30,.89);opacity:0;pointer-events:none;z-index:50;transition:opacity .3s ease}
#scrim.on{opacity:1;pointer-events:auto}
#fly{position:absolute;left:0;top:0;display:none;z-index:51;border-radius:6px;overflow:hidden;transform-origin:0 0;touch-action:none;cursor:grab;will-change:transform,width,height}
#fly img,#fly i{display:block;width:100%;height:100%}
#hint{position:absolute;left:0;width:430px;text-align:center;z-index:51;opacity:0;transition:opacity .25s ease;pointer-events:none}
#hint img,#hint svg{display:block;margin:0 auto;opacity:.79}
#hint svg{margin-top:15px}
#flyX{left:371px;top:20px;width:44px;height:44px;z-index:52;display:none}
#flyX svg{position:absolute;left:10px;top:10px;width:24px;height:24px;pointer-events:none}
#scrim.on~#flyX{display:block}
.wd{position:absolute;pointer-events:none;display:block;max-width:none;height:auto!important}
.card{background-size:cover}
#flyBlank,#pblank{position:relative;overflow:hidden}
#hint.on{opacity:1}
#hint span{display:inline-block;animation:nudge 1.5s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){#hint span{animation:none}}

/* cursor */
#cursor{position:absolute;left:0;top:0;width:43px;height:43px;margin:-21.5px 0 0 -21.5px;z-index:90;pointer-events:none;opacity:0;transition:opacity .22s ease;will-change:transform}
#cursor.on{opacity:1}
@media(hover:hover) and (pointer:fine){#stage,#stage *{cursor:none!important}}
#audio,#hapW{position:absolute;left:-9999px;top:0;opacity:0;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div id="stage" aria-label="Records Labels">

/* haptics: Android vibrates; iPhone uses the system switch tick */
function haptic(ms){
  try{if(navigator.vibrate&&navigator.vibrate(ms||8))return}catch(e){}
  try{$('hapL').click()}catch(e){}
}

/* ---------- layout: full width on every phone, height adapts ---------- */
var W=430,H=932,SC=1,OX=0,OY=0;
function layout(){
  var w=window.innerWidth,h=window.innerHeight;
  var s=w/430,lh=h/s;
  if(lh<590){s=h/932;lh=932}           /* tablets, laptops, landscape: whole frame */
  if(w/s>430&&lh===932)s=h/932;
  SC=s;H=lh;OX=Math.round((w-430*s)/2);OY=0;
  var st=$('stage');st.style.height=H+'px';st.style.transform='translate('+OX+'px,0) scale('+s+')';
  var r=document.documentElement.style;
  r.setProperty('--H',H+'px');
  /* player: 932 = your frame; shorter screens shrink the cover and wheel */
  var k=clamp((932-H)/232,0,1.5);
  var T=130-24*k,C=375-85*k;
  r.setProperty('--ct',T+'px');r.setProperty('--cs',C+'px');r.setProperty('--cl',(430-C)/2+'px');
  var bl=(430-C)/2+1,bt=T+C+34;
  r.setProperty('--bl',bl+'px');r.setProperty('--bw',(C-2)+'px');r.setProperty('--bt',bt+'px');
  Wh.R=116-36*k;Wh.cy=bt+5+(H-bt-5)/2+5*(1-k)+ (H>932?0:0);
  if(k===0&&H<=932)Wh.cy=743;
  placeWords();drawRing();
  r.setProperty('--my',-(932-Math.min(H,932))*.32+'px');
  r.setProperty('--ay',-clamp(872-H,0,140)+'px');
  buildStates();if(curView!==null)renderAll();
  stackSingles();
}

<script>
(function(){
  var P='<svg viewBox="0 0 18 18" fill="none"><path d="M7.065 9.6075L12.315 13.3575C12.5475 13.5225 12.8475 13.545 13.095 13.4175C13.3425 13.29 13.5 13.035 13.5 12.75L13.5 5.25C13.5 4.9725 13.3425 4.71 13.095 4.5825C12.99 4.53 12.87 4.5 12.75 4.5C12.5925 4.5 12.4425 4.545 12.315 4.6425L7.065 8.3925C6.87 8.535 6.75 8.76 6.75 9C6.75 9.24 6.87 9.4725 7.065 9.6075ZM6 13.5L4.5 13.5L4.5 4.5L6 4.5L6 13.5Z" fill="#000"/></svg>';
  var N='<svg viewBox="0 0 18 18" fill="none"><path d="M10.935 8.3925L5.685 4.6425C5.4525 4.4775 5.1525 4.455 4.905 4.5825C4.6575 4.71 4.5 4.965 4.5 5.25V12.75C4.5 13.0275 4.6575 13.29 4.905 13.4175C5.01 13.47 5.13 13.5 5.25 13.5C5.4075 13.5 5.5575 13.455 5.685 13.3575L10.935 9.6075C11.13 9.465 11.25 9.24 11.25 9C11.25 8.76 11.13 8.5275 10.935 8.3925ZM12 4.5H13.5V13.5H12V4.5Z" fill="#000"/></svg>';
  var PA='<svg viewBox="0 0 14 14" fill="none"><path d="M5.25 2.625H4.375C4.14294 2.625 3.92038 2.71719 3.75628 2.88128C3.59219 3.04538 3.5 3.26794 3.5 3.5V10.5C3.5 10.7321 3.59219 10.9546 3.75628 11.1187C3.92038 11.2828 4.14294 11.375 4.375 11.375H5.25C5.48206 11.375 5.70462 11.2828 5.86872 11.1187C6.03281 10.9546 6.125 10.7321 6.125 10.5V3.5C6.125 3.26794 6.03281 3.04538 5.86872 2.88128C5.70462 2.71719 5.48206 2.625 5.25 2.625ZM9.625 2.625H8.75C8.51794 2.625 8.29538 2.71719 8.13128 2.88128C7.96719 3.04538 7.875 3.26794 7.875 3.5V10.5C7.875 10.7321 7.96719 10.9546 8.13128 11.1187C8.29538 11.2828 8.51794 11.375 8.75 11.375H9.625C9.85706 11.375 10.0796 11.2828 10.2437 11.1187C10.4078 10.9546 10.5 10.7321 10.5 10.5V3.5C10.5 3.26794 10.4078 3.04538 10.2437 2.88128C10.0796 2.71719 9.85706 2.625 9.625 2.625Z" fill="#000"/></svg>';
  var PL='<svg viewBox="0 0 14 14" fill="none"><path d="M4.4 2.9C4.4 2.4 4.95 2.1 5.37 2.37L11.1 6.47C11.47 6.73 11.47 7.27 11.1 7.53L5.37 11.63C4.95 11.9 4.4 11.6 4.4 11.1V2.9Z" fill="#000"/></svg>';
  var np=document.createElement('div');np.id='np';
  np.innerHTML='<div id="npBg"></div><div id="npPrev" class="npI">'+P+'</div><div id="npMid" class="npI">'+PA+'</div><div id="npNext" class="npI">'+N+'</div><div id="npTitle" class="npT"></div><div id="npTime" class="npT"></div>'+
   '<button id="npTap" aria-label="Now playing"></button><button id="npB1" class="npB" aria-label="Back"></button><button id="npB2" class="npB" aria-label="Play or pause"></button><button id="npB3" class="npB" aria-label="Next"></button>';
  document.getElementById('landing').appendChild(np);
  var timer=0,eat=false,hold=false,listening=false;
  function active(){return T&&T!==EMPTY&&(listening||playing||pos>0||(T.src&&audio.currentTime>0))}
  function isOpen(){return np.classList.contains('open')}
  function arm(){clearTimeout(timer);timer=setTimeout(close,5000)}
  function close(){clearTimeout(timer);np.classList.remove('open')}
  function sync(){
    if(hold)return;
    np.classList.toggle('show',cur==='landing'&&!!active());
    np.classList.toggle('low',curView==='org');
    if(!np.classList.contains('show'))close();
    if(!T)return;
    document.getElementById('npTitle').textContent=T.title;
    document.getElementById('npTime').textContent=document.getElementById('time').textContent;
    document.getElementById('npMid').innerHTML=playing?PA:PL;
  }
  function step(d){var w=playing;hold=true;loadTrack(T===SILENCE?(d>0?0:TRACKS.length-1):idx+d);if(w)play();hold=false;sync()}
  press(document.getElementById('npTap'),function(){
    if(!isOpen()){np.classList.add('open');arm();return}
    close();show('player');

  press(document.getElementById('npB1'),function(){step(-1);arm()});
  press(document.getElementById('npB3'),function(){step(1);arm()});
  press(document.getElementById('npB2'),function(){playing?pause():play();sync();arm()});
  document.addEventListener('pointerdown',function(e){
    if(isOpen()&&!np.contains(e.target)){close();eat=true}
  },true);
  document.addEventListener('click',function(e){if(eat){eat=false;e.stopPropagation();e.preventDefault()}},true);
  var oR=render;render=function(){oR();sync()};
  var oS=show;show=function(id){oS(id);sync()};
  var oP=setPP;setPP=function(){oP();sync()};
  var oA=stopAudio;stopAudio=function(){if(!active())oA()};
  var oE=ended;ended=function(){hold=true;oE();if(!playing)listening=false;hold=false;sync()};
  var oB=setButtons;setButtons=function(){oB();sync()};
  var oT=toSleeve;toSleeve=function(k){
    if(k==='c'&&active()&&T!==SILENCE){var l=load;load=function(){};oT(k);load=l}else{listening=k==='c';oT(k)}
  };
  sync();
})();

<style>

#lstack.go .card{will-change:transform}

<script>
(function(){
  /* one space with exactly 20 vinyls. It loops: leave one edge, arrive at the other. */
  var PW=1000,PH=1860,MAX=2.2,HOME_S=1,FAR=155/262;
  var EXTRA=[[520,-120,262,262,e],[640,240,262,262,d],[500,600,262,262,b],[690,930,262,262,e],[60,1000,262,262,d],[360,1090,262,262,'c'],[-100,1280,262,262,e],[560,1330,262,262,b],[250,1430,262,262,d]];
  var all=MESSY.concat(EXTRA);
  all.forEach(function(p,i){p.dom=i});
  /* each vinyl: [label, place on landing, place when organised, word x,y on landing, word x,y organised] */
  var MAP=[['Ugly',0,15,65,35,58,9],['Pretty',1,6,42,101,52,10],['Insecure',13,2,79,63,48,11],['Well-mannered',2,1,32,84,19,9],['Sensitive',19,4,60,105,30,0],['Nerds',12,16,32,108,52,8],['Hardworking',3,19,34,130,23,25],['Childish',15,7,76,100,47,6],['Smart',4,10,89,46,54,9],['Creative',11,0,76,103,45,9],['Arrogant',14,5,56,105,38,4],['Lazy',17,8,95,105,55,8],['Rich',5,13,98,119,58,15],['Fake',6,3,89,84,55,9],['Put-together',7,18,50,102,29,13],['Attention-grabber',18,11,8,103,8,10],['Loud',8,12,110,87,56,8],[null,9,9],[null,10,14],[null,16,17]];
  var U=262/155;
  cards.forEach(function(c,i){
    var m=MAP[i];c.tile=all[m[1]];c.o=[ORG[m[2]],m[2]];c.word=m[0];
    if(m[0]){var w=WI[m[0]],im=document.createElement('img');im.className='wd';im.alt=m[0];im.src=w[0];
      im.style.width=(w[1]/262*100)+'%';c.wA=[(m[3]+w[3])/262*100,(m[4]+w[4])/262*100];c.wB=[(m[5]*U+w[3])/262*100,(m[6]*U+w[4])/262*100];c.el.appendChild(im);c.wi=im;c.el.setAttribute('aria-label',m[0])}
  });
  var oRC=renderCard;
  renderCard=function(c,i){oRC(c,i);if(c.wi){var a=arrT[i];c.wi.style.left=lerp(c.wA[0],c.wB[0],a)+'%';c.wi.style.top=lerp(c.wA[1],c.wB[1],a)+'%'}};
  /* the word stays on the vinyl when it is opened and in the sleeve */
  var chosen=null;
  function big(host,c){host.innerHTML='';if(!c||!c.word)return;var w=WI[c.word],im=document.createElement('img');im.className='wd';im.src=w[0];var p=w[1]/262*100;im.style.width=p+'%';im.style.left=(100-p)/2+'%';im.style.top='44%';host.appendChild(im)}
  var oOF=openFocus;
  openFocus=function(el,kind){chosen=null;cards.forEach(function(c){if(c.el===el)chosen=c});big($('flyBlank'),chosen);oOF(el,kind)};
  var oTS=toSleeve;
  toSleeve=function(k){big($('pblank'),k==='c'?null:chosen);if(chosen&&chosen.word)EMPTY.title=chosen.word;oTS(k)};
  press($('flyX'),closeFocus);
  buildStates();
  var cam={x:0,y:0,s:HOME_S},vx=0,vy=0,mom=0,camT=0,arranging=false,S=$('lstack');
  function MIN(){return Math.max(430/(PW-262),H/(PH-262))}
  function mod(a,n){return ((a%n)+n)%n}
  function pose(){
    var s=cam.s,pw=PW*s,ph=PH*s,c0=262*s;zoomT=0;
    cards.forEach(function(c){var p=c.tile;
      c.M={x:mod(p[0]*s+cam.x+c0,pw)-c0,y:mod(p[1]*s+cam.y+c0,ph)-c0,w:c0,h:c0,r:(p[4]==='c'?6:5)*s};c.mz=p.dom+100});
  }
  renderAll=function(){if(curView==='org'||arranging)return;pose();cards.forEach(renderCard)};
  function zoomAt(ns,cx,cy){ns=clamp(ns,MIN(),MAX);var k=ns/cam.s;cam.x=cx-(cx-cam.x)*k;cam.y=cy-(cy-cam.y)*k;cam.s=ns;renderAll();icon()}
  function icon(){if(curView==='org')return;var far=cam.s<.8;if(far!==icon.f){icon.f=far;setBtn($('zoomBtn'),far?'inn':'out',far?8:7,8,28)}}
  function stopAll(){cancelAnimationFrame(mom);cancelAnimationFrame(camT)}
  function drift(){
    var l=performance.now();S.classList.add('go');
    mom=requestAnimationFrame(function st(n){
      var dt=Math.min(32,n-l);l=n;cam.x+=vx*dt;cam.y+=vy*dt;renderAll();
      var f=Math.pow(.994,dt);vx*=f;vy*=f;
      if(Math.abs(vx)+Math.abs(vy)>.02)mom=requestAnimationFrame(st);else S.classList.remove('go');
    });
  }
  /* touch: one finger moves, two fingers zoom and move */
  var last=null;
  function P(t){var r=$('stage').getBoundingClientRect();return {x:(t.clientX-r.left)/SC,y:(t.clientY-r.top)/SC}}
  function blocked(e){return curView==='org'||arranging||focused||(e.target.closest&&e.target.closest('.round,#np'))}
  function grab(e){
    var ts=e.touches;stopAll();
    if(ts.length===1){last={p:P(ts[0]),t:e.timeStamp,moved:0};vx=vy=0}
    else if(ts.length>=2){var a=P(ts[0]),b2=P(ts[1]);last={two:1,d:Math.hypot(a.x-b2.x,a.y-b2.y),c:{x:(a.x+b2.x)/2,y:(a.y+b2.y)/2}}}
    S.classList.add('go');
  }
  var land=$('landing');
  land.addEventListener('touchstart',function(e){if(blocked(e)){last=null;return}grab(e)},{passive:true});
  land.addEventListener('touchmove',function(e){
    if(!last||curView==='org'||focused)return;
    var ts=e.touches;
    if(ts.length===1&&!last.two){
      var p=P(ts[0]),dx=p.x-last.p.x,dy=p.y-last.p.y,dt=Math.max(1,e.timeStamp-last.t);
      last.moved+=Math.abs(dx)+Math.abs(dy);if(last.moved<6)return;
      cam.x+=dx;cam.y+=dy;vx=vx*.6+dx/dt*.4;vy=vy*.6+dy/dt*.4;last.p=p;last.t=e.timeStamp;lastPinch=Date.now();renderAll();
    }else if(ts.length>=2&&last.two){
      var a=P(ts[0]),b2=P(ts[1]),dd=Math.hypot(a.x-b2.x,a.y-b2.y),c={x:(a.x+b2.x)/2,y:(a.y+b2.y)/2};
      cam.x+=c.x-last.c.x;cam.y+=c.y-last.c.y;zoomAt(cam.s*dd/last.d,c.x,c.y);last.d=dd;last.c=c;lastPinch=Date.now();vx=vy=0;
    }
  },{passive:false});
  function drop(e){
    if(!last)return;
    if(e.touches.length===0){var mv=last.moved>=6;last=null;if(mv&&Date.now()-lastPinch<80)drift();else S.classList.remove('go')}
    else grab(e);
  }
  land.addEventListener('touchend',drop);land.addEventListener('touchcancel',drop);
  /* mouse and trackpad */
  var mouse=null;
  land.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'&&!blocked(e)){stopAll();mouse={x:e.clientX,y:e.clientY}}});
  window.addEventListener('pointermove',function(e){if(mouse){var dx=e.clientX-mouse.x,dy=e.clientY-mouse.y;cam.x+=dx/SC;cam.y+=dy/SC;if(dx||dy)lastPinch=Date.now();mouse={x:e.clientX,y:e.clientY};renderAll()}});
  window.addEventListener('pointerup',function(){mouse=null});
  land.addEventListener('wheel',function(e){
    if(blocked(e))return;var p=P(e);
    if(e.ctrlKey)zoomAt(cam.s*Math.exp(-e.deltaY*.01),p.x,p.y);else{cam.x-=e.deltaX/SC;cam.y-=e.deltaY/SC;renderAll()}
  },{passive:false});
  /* zoom button glides */
  function glide(to){
    stopAll();var f=cam.s,t0=performance.now(),cx=215,cy=H/2;S.classList.add('go');
    camT=requestAnimationFrame(function st(n){var t=Math.min(1,(n-t0)/560);zoomAt(lerp(f,to,eio(t)),cx,cy);if(t<1)camT=requestAnimationFrame(st);else S.classList.remove('go')});
  }
  zoomTo=function(){if(Date.now()-lastPinch<400)return;glide(cam.s<.8?HOME_S:FAR)};
  /* organise: all 20 glide from wherever they are into your layout, and back */
  var oArr=arrange;
  arrange=function(to){
    if(arranging)return;stopAll();arranging=true;pose();
    if(to){arrT=arrT.map(function(){return 0});oArr(true)}
    else{arrT=arrT.map(function(){return 1});oArr(false);curView='messy';icon.f=null;setButtons();icon()}
    setTimeout(function(){arranging=false;if(curView!=='org')renderAll()},1000);
  };
  renderAll();
  window.__cam=cam;
})();
</script>
